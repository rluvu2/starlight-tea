# main 브랜치에 올리면 GitHub Pages 로 자동 배포합니다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번만 바꿔 주세요.
# (커스텀 도메인은 같은 화면의 Custom domain 칸에서 연결합니다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test # 상태 머신·블렌딩·조언·세이브·광고 단위 테스트. 하나라도 실패하면 배포하지 않습니다.
      - run: npm run build # 데이터 검사(npm run check) 후 빌드. 설정은 .env 를 따릅니다.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
